name: Validate

# HACS compliance (hacs/action) and hassfest - the checks a HACS repository is
# expected to pass. The unit tests live in `tests.yml`, so a failure there is
# reported separately from a packaging problem.
#
# No `schedule:` trigger on purpose: GitHub disables a scheduled workflow that
# sees no activity for 60 days, and disabling it also stops the push/PR runs of
# the same workflow. A validation gate that turns itself off is worse than no
# gate, so these checks run only where they matter - on pushes and pull requests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" would require being listed in home-assistant/brands, which no
          # longer accepts custom integrations. This one ships its own images under
          # custom_components/koolnova/brand/, so the check is skipped.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
