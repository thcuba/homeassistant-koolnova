name: Validate

# The single validation workflow of this repo: HACS compliance (hacs/action),
# hassfest and the unit tests. Overlapping workflows used to run the same
# validation more than once per PR (a second HACS-only workflow fired on every
# branch and daily); they were removed and their coverage lives here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" would require being listed in home-assistant/brands, which no
          # longer accepts custom integrations. This one ships its own images under
          # custom_components/koolnova/brand/, so the check is skipped.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the only runtime dependency of the vendored client
        run: pip install requests
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
